name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name mdk_tech_ai_automation --org com.mdktech .
          fi

      - name: Harden Android manifest (no cleartext, INTERNET permission)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          s = re.sub(r'\s*android:usesCleartextTraffic="[^"]*"', '', s)
          s = s.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          p.write_text(s)
          print(s)
          EOF

      - name: Pub get
        env:
          PUB_CACHE: ${{ env.PUB_CACHE || '/home/runner/.pub-cache' }}
        run: flutter pub get

      - name: Patch flutter_inappwebview_android deprecated ProGuard call
        run: |
          # flutter_inappwebview_android 1.1.3 uses getDefaultProguardFile('proguard-android.txt'),
          # which AGP rejects. Switch to the optimize variant in the pub cache copy.
          find "$PUB_CACHE" -path '*flutter_inappwebview_android*/android/build.gradle' \
            -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +
          find "$PUB_CACHE" -path '*flutter_inappwebview_android*/android/build.gradle' -exec grep -n proguard {} +

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mdk-jarvis-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
