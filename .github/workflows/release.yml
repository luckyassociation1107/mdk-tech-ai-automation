name: Release APK

# Runs on a version tag (v1.0.0, v1.1.0, ...) or manually.
# NOTE: the APK is signed with Flutter's default debug key until a release
# keystore is configured (see docs/CAPABILITIES_AND_LIMITATIONS.md, "Release signing").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name mdk_tech_ai_automation --org com.mdktech .
          fi

      - name: Harden Android manifest
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for perm in ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO']:
              if perm not in s:
                  s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="' + perm + '" />', 1)
          s = re.sub(r'\s*android:usesCleartextTraffic="[^"]*"', '', s)
          s = s.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          p.write_text(s)
          EOF

      - name: Patch flutter_inappwebview_android deprecated ProGuard call
        run: |
          find "$PUB_CACHE" -path '*flutter_inappwebview_android*/android/build.gradle' \
            -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

      - run: flutter pub get

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdk-jarvis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
